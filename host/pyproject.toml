[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csi-motion"
version = "0.1.0"
description = "PC-side tools for ESP32 Wi-Fi CSI motion sensing"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pyserial>=3.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
csi-motion = "csi_motion.cli:main"

[tool.setuptools.packages.find]
include = ["csi_motion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
